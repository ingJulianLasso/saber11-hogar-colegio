[project]
name = "saber11"
version = "0.1.0"
description = "Proyecto integrador de Ciencia de Datos: hogar, colegio y resultados en el examen Saber 11 del ICFES"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.11.0",
    "polars",
    "pandas",
    "pyarrow",
    "numpy",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "xgboost",
    "shap",
    "matplotlib",
    "seaborn",
    "plotly",
    "kaleido",
    "streamlit",
    "jupytext",
    "nbconvert",
    "nbformat",
    "ipykernel",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
